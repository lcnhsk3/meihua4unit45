        }

            position: relative;

        }

        .start-screen {

        }

            border: none;

            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;

        .btn-secondary {

            color: white;

        .btn-secondary:hover {

            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

            font-weight: bold;
            color: #667eea;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 15px 40px;
            border-radius: 50%;
            border: 4px solid #667eea;
            min-width: 100px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .timer.warning {
            color: #f56565;
            border-color: #f56565;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .question-text {
            font-size: 32px;
            color: #333;
            text-align: center;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 20px;
            border-radius: 12px;
            border: 3px solid #667eea;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.4;
        }

            font-size: 48px;
            letter-spacing: 2px;
        }

        .question-text.sentence-mode {
            font-size: 28px;
            font-family: 'SimSun', '宋体', serif;
        }

        .balloons-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 15px 0;
            position: relative;
        }

        .balloon {
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .balloon:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .balloon-body {
            width: 100%;
            height: 100%;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
            padding: 15px;
        }

        .balloon:nth-child(1) .balloon-body {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
        }

        .balloon:nth-child(2) .balloon-body {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a8a0 100%);
        }

        .balloon:nth-child(3) .balloon-body {
            background: linear-gradient(135deg, #ffd93d 0%, #ffb703 100%);
        }

            background: linear-gradient(135deg, #a8e6cf 0%, #7fb685 100%);
        }

            background: linear-gradient(135deg, #ff9ff3 0%, #feca57 100%);
        }

            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
        }

        .balloon:nth-child(7) .balloon-body {
            background: linear-gradient(135deg, #ff9ff3 0%, #ff6348 100%);
        }

        .balloon:nth-child(8) .balloon-body {
            background: linear-gradient(135deg, #ee5a6f 0%, #c44569 100%);
        }

            font-size: 36px;
            font-family: 'SimSun', '宋体', serif;
            color: white;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            word-wrap: break-word;
            line-height: 1.3;
        }

        .balloon-string {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: #999;
        }

        .balloon.popped {
            animation: pop 0.5s ease forwards;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            animation: feedbackShow 1s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .feedback.correct {
            color: #48bb78;
        }

        .feedback.incorrect {
            color: #f56565;
        }

        @keyframes feedbackShow {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

            display: none;
            justify-content: center;

            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        }

        .arrow-cursor {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }

        .arrow-cursor svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
        }

            0% {
                transform: translateY(0) rotate(0deg);

            }
            100% {

            }

            top: 50%;
            left: 50%;

            pointer-events: none;

            }

            }
            100% {

                opacity: 1;
            }

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        let shuffledQuestions = [];
        let timerInterval = null;
        let timeRemaining = 10;
        let currentMode = 'vocabulary'; // 'vocabulary' or 'sentence'

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function playCorrectSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
            oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
            oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function playIncorrectSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(200, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
        }

        function playTickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);

            const title = config.game_title || defaultConfig.game_title;

            const restartBtn = config.restart_button_text || defaultConfig.restart_button_text;

            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;

            document.getElementById('gameTitle').textContent = title;
            document.getElementById('gameSubtitle').textContent = subtitle;
            document.getElementById('instructionText').textContent = instruction;

            document.body.style.background = `linear-gradient(135deg, ${bgColor} 0%, #764ba2 100%)`;
            
            const primaryBtns = document.querySelectorAll('.btn-primary');
            primaryBtns.forEach(btn => {
                btn.style.background = `linear-gradient(135deg, ${primaryColor} 0%, #764ba2 100%)`;

            const secondaryBtns = document.querySelectorAll('.btn-secondary');

                btn.style.background = secondaryColor;

            return {

                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ background_color: value });
                            }
                        }
                    },

                document.getElementById('arrowCursor').style.display = 'none';
            });

                const arrow = document.getElementById('arrowCursor');
                arrow.style.left = e.clientX + 'px';
                arrow.style.top = e.clientY + 'px';
            });

            currentMode = mode;
            currentQuestionIndex = 0;
            score = 0;
            
            if (mode === 'vocabulary') {
                shuffledQuestions = shuffleArray(vocabularyQuestions);
            } else {
                shuffledQuestions = shuffleArray(sentenceQuestions);
            }
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'flex';
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            timeRemaining = 10;
            const question = shuffledQuestions[currentQuestionIndex];
            
            const modeText = currentMode === 'vocabulary' ? 'Kosakata' : 'Kalimat';
            document.getElementById('questionNumber').textContent = `Soal ${modeText} ${currentQuestionIndex + 1} dari ${shuffledQuestions.length}`;
            
            const questionTextElement = document.getElementById('questionText');
            questionTextElement.textContent = question.text;
            questionTextElement.className = currentMode === 'vocabulary' ? 'question-text vocabulary-mode' : 'question-text sentence-mode';
            
            document.getElementById('nextButtonContainer').style.display = 'none';

            const progress = ((currentQuestionIndex) / shuffledQuestions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeRemaining;
            timerElement.classList.remove('warning');

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerElement.textContent = timeRemaining;

                if (timeRemaining <= 3) {
                    timerElement.classList.add('warning');
                    playTickSound();
                }

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    if (!answered) {
                        handleTimeout();
                    }
                }
            }, 1000);

            const balloonsArea = document.getElementById('balloonsArea');
            balloonsArea.innerHTML = '';

            const shuffledOptions = shuffleArray(question.options);

            shuffledOptions.forEach((option, index) => {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.innerHTML = `
                    <div class="balloon-body">
                        <div class="balloon-text">${option}</div>
                    </div>
                    <div class="balloon-string"></div>
                `;
                balloon.addEventListener('click', () => selectAnswer(option, balloon));
                balloonsArea.appendChild(balloon);
            });
        }

        function handleTimeout() {
            answered = true;
            playIncorrectSound();
            showBigX();

            const feedback = document.createElement('div');
            feedback.className = 'feedback incorrect';
            feedback.textContent = '⏰ Waktu Habis!';
            document.querySelector('.balloons-area').appendChild(feedback);

            const question = shuffledQuestions[currentQuestionIndex];
            
            if (window.dataSdk) {
                window.dataSdk.create({
                    question_id: question.id,
                    hanzi: question.text,
                    user_answer: "TIMEOUT",
                    is_correct: false,
                    answered_at: new Date().toISOString()
                });
            }

            setTimeout(() => {
                feedback.remove();
                if (currentQuestionIndex < shuffledQuestions.length - 1) {
                    document.getElementById('nextButtonContainer').style.display = 'flex';
                } else {
                    showResults();
                }
            }, 1500);
        }

        async function selectAnswer(selectedOption, balloonElement) {
            if (answered) return;
            answered = true;

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            const question = shuffledQuestions[currentQuestionIndex];
            const isCorrect = selectedOption === question.correct;

            balloonElement.classList.add('popped');

            const feedback = document.createElement('div');
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.textContent = isCorrect ? '✓ Benar!' : '✗ Salah!';
            document.querySelector('.balloons-area').appendChild(feedback);

            if (isCorrect) {
                score++;
                createConfetti();
                playCorrectSound();
            } else {
                showBigX();
                playIncorrectSound();
            }

            if (window.dataSdk) {
                const loadingBtn = document.getElementById('nextButton');
                loadingBtn.disabled = true;
                loadingBtn.classList.add('loading');

                const result = await window.dataSdk.create({
                    question_id: question.id,
                    hanzi: question.text,
                    user_answer: selectedOption,
                    is_correct: isCorrect,
                    answered_at: new Date().toISOString()
                });

                loadingBtn.disabled = false;
                loadingBtn.classList.remove('loading');

                if (!result.isOk) {
                    console.error("Failed to save answer");
                }
            }

            setTimeout(() => {
                feedback.remove();
                if (currentQuestionIndex < shuffledQuestions.length - 1) {
                    document.getElementById('nextButtonContainer').style.display = 'flex';
                } else {
                    showResults();
                }
            }, 1500);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function showResults() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'flex';
            document.getElementById('scoreDisplay').textContent = `${score}/${shuffledQuestions.length}`;

            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
            document.getElementById('progressBar').style.width = '0%';
        }

        initializeApp();
